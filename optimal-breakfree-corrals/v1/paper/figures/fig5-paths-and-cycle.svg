<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="452" viewBox="0 0 1000 452" role="img" aria-labelledby="title desc">
<title id="title">Paths and a cycle in Z_11</title>
<desc id="desc">Two directed paths in the integers modulo 11 cover W = {1, ..., 10}; they start at 1 and 5, end at 8 and 6, and their eight differences are distinct. The two dashed edges close them into one cycle and add the differences 8 and 6, so the cycle uses every nonzero difference once.</desc>
