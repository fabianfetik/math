<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="520" viewBox="0 0 1000 520" role="img" aria-labelledby="title desc">
<title id="title">An optimal corral of height three</title>
<desc id="desc">Left: the three rows of an optimal corral on the 15-site cycle as rings; each arc is a gap, coloured by its length, and each numbered spoke ends at the row occupying that site. Every ring shows each of the five colours once. Right: three rows of five points fill exactly the 1 + 2 + 3 + 4 + 5 = 15 sites, the equality case of hn &lt;= n(n+1)/2.</desc>
