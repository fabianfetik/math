<svg xmlns="http://www.w3.org/2000/svg" width="1010" height="480" viewBox="0 0 1010 480" role="img" aria-labelledby="title desc">
<title id="title">Latin choices in one copy</title>
<desc id="desc">Panel a: for one copy, a Latin square S of order three chooses the sites: the three rows j cross three pools t of three candidate sites s, and the filled site in pool t on row j is s = S_jt. Each pool is used once at each of its sites, and each row uses every offset once. Panel b: a centre with offset s between its fixed neighbours has gaps a_j+s and b_j-s; over the pools a row therefore keeps complete gap blocks.</desc>
