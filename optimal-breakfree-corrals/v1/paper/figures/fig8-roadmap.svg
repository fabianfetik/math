<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="484" viewBox="0 0 1100 484" role="img" aria-labelledby="title desc">
<title id="title">The order of choices in Theorem 9 and its use</title>
<desc id="desc">One sample is fixed before the query. For a query, the special layers place the endpoints, the ordinary transitions build a path system, and the colour bank allows every extra fragment to be attached. One exact matching closes the construction. The router setting is chosen after that match. A single path closes the diversity prefix, leading to tiles, Latin choices, decoding, and the logarithmic count.</desc>
